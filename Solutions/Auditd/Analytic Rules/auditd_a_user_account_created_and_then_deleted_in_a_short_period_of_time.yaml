id: 19b97e38-42f2-4b65-af2e-a86857123ffb
name: AuditD - A user account created and then deleted in a short period of time
description: |
  'Identifies creation and removal of user accounts on the host within an hour by default.
   Consider changing the "timeDifmin" variable to adjust time difference between user creation and deletion.
   To enable this rule, the following AuditD rules must be applied:
      -w /usr/sbin/useradd -p x -k user_mgmt_useradd
      -w /usr/sbin/userdel -p x -k user_mgmt_userdel
      -w /usr/sbin/adduser -p x -k user_mgmt_adduser
      -w /usr/sbin/deluser -p x -k user_mgmt_deluser'
severity: High
status: Available
requiredDataConnectors:
- connectorId: AuditDSyslog
  dataTypes:
  - Syslog
queryFrequency: 1h
queryPeriod: 2h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persistence
- Impact
- DefenceEvasion
relevantTechniques:
- T1136
- T1136.001
- T1136.002
- T1070.004
query: |
  let keys = dynamic(["user_mgmt_useradd", "user_mgmt_userdel", "user_mgmt_adduser", "user_mgmt_deluser"]);
  let timeDifmin = 60;
  // getting event ids
  let auditEventIds = ASimLinuxAuditdSyslogV01(disabled=false)
      | where key in (keys)
      | project auditEventId;
  // gettings events by their event id
  let auditEvents = ASimLinuxAuditdSyslogV01(disabled=false)
      | where auditEventId in (auditEventIds);
  // deleting user
  let UserDeletionEvents = auditEvents
      | where AuditEventType == 'EXECVE' and (a0 == 'deluser' or a0 == 'userdel')
      | extend _deluser_raw_parsedData = iif(a0 == 'deluser',
          // getting username and group from cmdline
          set_union(
              extract_all(@"deluser\s(?:(\w+\S+)\s(\w+\S+)|(\w+\S+))", allArgs)[0],
              extract_all(@"deluser.+(\s(\w+\S+)\s(\w+\S+)$)?\s(\w+\S+)\s(\w+\S+)$|\s(\w+\S+)$", allArgs)[0]
          ),
          dynamic(null)),
          _userdel_extractedUser = iif(a0 == 'userdel',tostring(split(allArgs, " ")[-1]),"")
      // getting username
      | extend deletedUser = iif(
          a0 == 'deluser',
          iff(
              isnotempty(_deluser_raw_parsedData) and array_length(_deluser_raw_parsedData) == 1,
              tostring(_deluser_raw_parsedData[0]),
              "" 
          ),
          iff(a0 == 'userdel',_userdel_extractedUser,"")
      )
      | where isnotempty(deletedUser)
      | project
          DeletedAt = TimeGenerated,
          deletedUser,
          Dvc,
          auditEventId,
          SyslogMessage;
  // creating user
  let UserCreationEvents = auditEvents
      | where AuditEventType == 'EXECVE' and (a0 == 'adduser' or a0 == 'useradd')
      | extend addedUser = tostring(split(allArgs, " ")[-1])
      | project
          CreatedAt = TimeGenerated,
          addedUser,
          Dvc,
          auditEventId,
          SyslogMessage;
  UserCreationEvents
      | join kind=inner (UserDeletionEvents) on $left.addedUser == $right.deletedUser and $left.Dvc == $right.Dvc
      | where datetime_diff('minute', CreatedAt, DeletedAt) <= timeDifmin
      | project Dvc, 
          Username=addedUser, 
          CreatedAt, 
          CreateAuditEventId=auditEventId, 
          DeletedAt,
          DeleteAuditEventId=auditEventId1;
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Dvc
- entityType: Account
  fieldMappings:
  - identifier: Name
    columnName: Username
version: 1.0.0
kind: Scheduled
