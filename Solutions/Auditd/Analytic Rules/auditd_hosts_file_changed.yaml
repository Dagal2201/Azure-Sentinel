id: 5cac1fd8-6ee8-4ad7-b34d-f5fe5e5ae7a9
name: AuditD - hosts file changed
description: |
  'This query detects any modifications to the hosts file
  To enable this rule, the following AuditD rule must be applied:
    -w /etc/hosts -p wa -k net_conf_hosts'
severity: Informational
status: Available
requiredDataConnectors:
- connectorId: AuditDSyslog
  dataTypes:
  - Syslog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- DefenseEvasion
- Persitence
- Impact
relevantTechniques:
- T1565
- T1609
query: |
  let keys = dynamic(["net_conf_hosts"])
  // getting event ids
  let auditEventIds = ASimLinuxAuditdSyslogV01(disabled=false)
      | where key in (keys)
      | project auditEventId;
  // gettings events by their event id
  let auditEvents = ASimLinuxAuditdSyslogV01(disabled=false)
      | where auditEventId in (auditEventIds);
  // counting changes and getting auid
  auditEvents
      | summarize ExecCount = count(), ExecAt=min(TimeGenerated) by Dvc
      | project ExecAt, Dvc, ExecCount
      | order by ExecCount
entityMappings:
- entityType: HostName
  fieldMappings:
  - identifier: Host
    columnName: Dvc
version: 1.0.0
kind: Scheduled
