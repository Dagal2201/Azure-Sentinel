id: 31c20364-7cc2-4ff4-8a91-6bb1b3d06176
name: AuditD - Files briefly appeared in forbidden directories before being 
  removed
description: |
  'This query aims to detect multiple addition and removal activities originating from a user-specified list of forbidden directories
  Fill the "keys" variable in the Kusto query with the keys you used in your AuditD rules.
  To enable this rule, the following AuditD rules must be applied for each directory you want to monitor:
    -w <path-to-dir> -p x -k <key>'
severity: Low
status: Available
requiredDataConnectors:
- connectorId: AuditDSyslog
  dataTypes:
  - Syslog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- Persitence
- DefenceEvasion
- Impact
relevantTechniques:
- T1543
- T1070
- T1565
query: |
  let SuspDirOpsCount = 3;
  // declare directories here
  let dirsToMonitor = dynamic(['/tmp']);
  let CreateEventIds = ASimLinuxAuditdSyslogV01(false)
      | where syscall has_any (2, 257, 85, 83, 258, 89, 267, 86, 265)
      | project auditEventId;
  let DeleteEventIds = ASimLinuxAuditdSyslogV01(false)
      | where syscall has_any (87, 263, 84)
      | project auditEventId;
  let CreateEvents = ASimLinuxAuditdSyslogV01(false)
      | where auditEventId in (CreateEventIds)
      | where isnotempty(name) and 
          name has_any(dirsToMonitor)
      | project TimeGenerated, auditEventId, Dvc, name;
  let DeleteEvents = ASimLinuxAuditdSyslogV01(false)
      | where auditEventId in (DeleteEventIds)
      | where isnotempty(name) and 
          name has_any(dirsToMonitor)
      | project TimeGenerated, auditEventId, Dvc, name;
  CreateEvents
      | join kind=inner (DeleteEvents) on $left.name == $right.name and $left.Dvc == $right.Dvc
      | where TimeGenerated <= TimeGenerated1
      | summarize SuspDirOps = count(), CreatedAt=avg(TimeGenerated), DeletedAt=avg(TimeGenerated1)  by Dvc
      | project CreatedAt, DeletedAt, Dvc, SuspDirOps
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Dvc
version: 1.0.0
kind: Scheduled
