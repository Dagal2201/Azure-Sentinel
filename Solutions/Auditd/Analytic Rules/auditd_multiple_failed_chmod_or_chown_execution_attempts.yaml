id: c96f460e-9167-4b88-9049-cd597bc14b04
name: AuditD - Multiple failed chmod or chown execution attempts
description: |
  'This query detects failed chmod and chown execution attempts per host
  To enable this rule, the following AuditD rules must be applied:
    -a always,exit -F arch=b64 -S chmod -S fchmod -S fchmodat -F auid!=-1 -F exit!=0 -k file_mod_chmod
    -a always,exit -F arch=b64 -S chown -S fchown -S fchownat -F auid!=-1 -F exit!=0 -k file_mod_chown
    -a always,exit -F arch=b64 -S rename -S renameat -S truncate -S setxattr -S lsetxattr -S removexattr -S lremovexattr -F auid!=-1 -F exit!=0 -k file_mod_unsuccess'
severity: Medium
status: Available
requiredDataConnectors:
- connectorId: AuditDSyslog
  dataTypes:
  - Syslog
queryFrequency: 1h
queryPeriod: 1h
triggerOperator: gt
triggerThreshold: 0
tactics:
- PrivilegeEscalation
- DefenseEvasion
relevantTechniques:
- T1222
- T1548
query: |
  let AllowedAttempts = 3;
  let keys = dynamic(["file_mod_unsuccess", "file_mod_chmod", "file_mod_chown"]);
  ASimLinuxAuditdSyslogV01(false)
      | where key in (keys) and
          exit != 0
      | summarize ModificationAttempts = count(), ModificatedAt=min(TimeGenerated) by Dvc
      | where ModificationAttempts >= AllowedAttempts
      | project ModificatedAt, Dvc, ModificationAttempts, AllowedAttempts
      | order by ModificationAttempts
entityMappings:
- entityType: Host
  fieldMappings:
  - identifier: HostName
    columnName: Dvc
version: 1.0.0
kind: Scheduled
